<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>All Certificates</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts (Optional for style enhancement) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      background-color: #f1f3f6;
      font-family: 'Poppins', sans-serif;
    }

    .navbar {
      background: linear-gradient(90deg, #4b6cb7, #182848);
    }

    .navbar-brand {
      font-weight: 600;
      color: #fff;
    }

    .navbar-brand:hover {
      color: #e2e2e2;
    }

    h2.section-title {
      font-weight: 600;
      color: #333;
    }

    .card {
      border: none;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .card-body {
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1rem;
      color: #6c757d;
    }

    .card-subtitle {
      color: #007bff;
      font-size: 0.95rem;
    }

    .qr-wrapper {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .btn-download {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container ">
      <a class="navbar-brand" href="#">Certificate Portal</a>
      <a class="navbar-brand" href="http://127.0.0.1:8000/admin/" target="_blank">Admin</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container my-5">
    <h2 class="section-title text-center mb-5">All Certificates</h2>
    <div class="row">
      {% for certificate in certificates %}
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card h-100 shadow-sm bg-white">
            <div class="card-body">
              <h5 class="card-title">Certificate Number</h5>
              <p class="card-text text-muted">{{ certificate.certificate_number }}</p>

              <h6 class="card-subtitle mb-2">Name</h6>
              <p class="card-text">{{ certificate.name }}</p>

              {% if certificate.qr_code %}
                <div class="qr-wrapper text-center">
                  <img src="{{ certificate.qr_code.url }}" alt="QR Code" class="img-fluid mb-2" style="max-width: 150px;" />
                  <br>
                  <a href="{{ certificate.qr_code.url }}" download="qr_{{ certificate.certificate_number }}.png" class="btn btn-sm btn-outline-primary btn-download">
                    Download QR Code
                  </a>
                </div>
              {% else %}
                <p class="text-danger mt-3">No QR code available.</p>
              {% endif %}
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
